# Build a test version on GitHub's own machines (no EAS build credits) and, optionally, send it to Firebase App
# Distribution testers. Run it from GitHub: Actions → "Test build" → Run workflow.
#
# The build runs `eas build --local` on the GitHub runner: same eas.json profile as an EAS cloud build, but the
# compiling happens here, so it doesn't use Expo build credits. The finished app is attached to the run
# (Summary → Artifacts) whether or not it is sent to testers.
#
# Repository secrets needed (Settings → Secrets and variables → Actions):
#   EXPO_TOKEN                Expo access token (expo.dev → Account settings → Access tokens). Still needed: the
#                             signing keys and the build number live on EAS.
#   FIREBASE_SERVICE_ACCOUNT  only to send to testers: JSON key of a service account with "Firebase App Distribution Admin"
#   FIREBASE_ANDROID_APP_ID   optional (the script has the Android one built in)
#   FIREBASE_IOS_APP_ID       only for iPhone builds sent to testers
# Optional repository variable (Settings → Secrets and variables → Actions → Variables):
#   EXPO_PUBLIC_API_URL       the dictation server's address, baked into the build
#
# Cost: Android runs on Linux and counts 1× against GitHub's free minutes (2,000 a month on private repos).
# iPhone needs macOS, which counts 10×, and the Apple signing set up on EAS.
name: Test build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which phones
        type: choice
        options: [android, ios]
        default: android
      distribute:
        description: Send it to Firebase testers (otherwise just attach it to the run)
        type: boolean
        default: true
      notes:
        description: Release notes for testers
        required: false
        default: ''

jobs:
  build:
    runs-on: ${{ inputs.platform == 'ios' && 'macos-15' || 'ubuntu-latest' }}
    timeout-minutes: 90
    env:
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
    steps:
      - uses: actions/checkout@v4

      # The Linux runner has ~14 GB free; a React Native Android build needs more headroom than that leaves.
      - name: Free disk space (Android)
        if: inputs.platform == 'android'
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL && df -h /

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Java 17 (Android)
        if: inputs.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Latest Xcode (iPhone)
        if: inputs.platform == 'ios'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - run: npm ci

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build on this runner (no EAS credits)
        run: |
          mkdir -p dist
          ext=${{ inputs.platform == 'ios' && 'ipa' || 'apk' }}
          eas build --platform ${{ inputs.platform }} --profile preview --local --non-interactive \
            --output "dist/deadline-${{ inputs.platform }}.$ext"
          ls -lh dist

      - name: Attach the app to this run
        uses: actions/upload-artifact@v4
        with:
          name: deadline-${{ inputs.platform }}
          path: dist/deadline-${{ inputs.platform }}.*
          retention-days: 14

      - name: Send to Firebase App Distribution
        if: inputs.distribute
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_ANDROID_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          FIREBASE_IOS_APP_ID: ${{ secrets.FIREBASE_IOS_APP_ID }}
          RELEASE_NOTES: ${{ inputs.notes }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          BUILD_FILE="$(ls dist/deadline-${{ inputs.platform }}.*)" bash scripts/distribute.sh ${{ inputs.platform }}
